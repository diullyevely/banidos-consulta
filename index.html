<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Consulta de Banimentos | TOXICA TXS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="site">

            type="button"

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
